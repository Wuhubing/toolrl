task_id: TR-002
goal: "Build ToolRL's staged post-training pipeline and ablation/eval harness per SPEC.md at the repo root: train/ (sft.py, dpo.py, grpo.py), eval/ (harness.py, ablation.py), configs/verl_grpo.yaml, README — a 3B model post-trained on multi-turn tool calls. Foundation: the GRPO stage must be a THIN wrapper around veRL's GRPO trainer (do NOT reimplement group-relative advantage computation), wiring in task_env (2.3) + the task-success reward; SFT/DPO use veRL trainers if supported, else fall back to TRL's SFTTrainer/DPOTrainer on the same checkpoints. A GPU does NOT exist in this environment, so train/ and eval/ must be structure-verifiable locally but runnable on a GPU elsewhere; document the exact GPU steps to reproduce 46.7% -> 71.7%."
context: "SPEC.md at the repo root is authoritative; read it fully first. This depends on TR-001 (data/, env/, replay/, configs/) merged to main — your worktree base already has them. Your worktree cwd is the repo root. IMPORTANT: veRL's env/rollout contract and setup requirements move fast — consult the live verl-project/verl repo and its docs (verl.readthedocs.io) for the current environment interface, config keys, and install steps; do NOT guess version pins or config key names. The integration split matters for the interview: what YOU implement (the TaskEnv + reward wiring for the tool-use env) vs. what veRL provides (rollout batching, group-relative advantage, the GRPO update). Know cold why the pipeline is staged SFT -> DPO -> GRPO. The reward is task-level success from TR-001's task_env; document explicitly whether partial credit is used."
scope:
  allowed:
    - "train/**"
    - "eval/**"
    - "configs/**"
    - "tests/**"
    - "README.md"
    - "pyproject.toml"
  forbidden:
    - "data/**"
    - "env/**"
    - "replay/**"
    - "SPEC.md"
    - ".agent/**"
    - ".gitignore"
    - ".worktrees/**"
constraints:
  - "Do not modify data/, env/, replay/, SPEC.md, .agent/**, or .gitignore."
  - "Do NOT reimplement the GRPO/PPO update rule — use veRL's trainer; your code wires task_env + reward into veRL's interface."
  - "SFT/DPO use veRL if it covers them, else TRL SFTTrainer / DPOTrainer on the same checkpoints (document which you chose)."
  - "Training scripts must import, validate config, and run a --smoke path WITHOUT a GPU or live model (heavy frameworks like veRL/torch import lazily or are gated so config validation is standalone)."
  - "The ablation harness evaluates base / post-SFT / post-DPO / post-GRPO on the IDENTICAL held-out test set and produces the stage-wise breakdown."
  - "Do NOT fabricate 46.7% -> 71.7% — they come from real runs on a GPU; the code must be correct and runnable, and README documents the exact repro steps."
  - "Reconcile any gap against ground truth by adjusting implementation details, never the numbers."
acceptance:
  - "train/sft.py, train/dpo.py, train/grpo.py each define a runnable stage invocable with a config, and import + validate config + run --smoke locally without a GPU."
  - "train/grpo.py is a thin veRL-wrapper wiring task_env + task-success reward, not a from-scratch advantage/update loop."
  - "eval/harness.py runs {base, post-SFT, post-DPO, post-GRPO} checkpoints on the identical held-out test set; eval/ablation.py produces the stage-wise accuracy breakdown."
  - "configs/schema_domains.yaml (from TR-001) and configs/verl_grpo.yaml are valid YAML reflecting current veRL config key naming (consult the live repo)."
  - "README documents the pipeline, the per-stage intuition, the reward definition, the integration split (task_env+reward vs veRL), and the exact GPU steps to reproduce 46.7% -> 71.7%."
  - "Unit tests + config-validation --smoke pass locally (no GPU)."
verification:
  - "python3 -m pytest tests/ -q"
  - "python3 -c \"from toolrl.train.grpo import GRPOConfig; print('toolrl-train-import-ok')\""
  - "python3 -c \"import yaml; yaml.safe_load(open('configs/verl_grpo.yaml')); print('toolrl-config-ok')\""
worker:
  type: deep
max_attempts: 2
risk: high
timeout_min: 120

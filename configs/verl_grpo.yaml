# ToolRL GRPO stage — veRL run config.
#
# This file is expressed in veRL's config vocabulary and is consumed by
# `python -m verl.trainer.main_ppo` (GRPO == PPO with
# `algorithm.adv_estimator=grpo`). Key names reflect verl@main (2026-09);
# consult verl.readthedocs.io / the live repo before bumping veRL — its
# multi-turn + tool keys move fast.
#
# The GRPO stage does NOT reimplement the advantage/update rule: veRL computes
# group-relative advantages, KL regularization (added to the loss via
# `use_kl_loss`, not the reward), and the policy update. ToolRL only wires in
# the TaskEnv (via the `toolrl` tool in configs/tools.yaml) and the task-success
# reward (custom_reward_function -> toolrl/train/reward.py).

# ToolRL-only metadata (NOT forwarded to veRL; see toolrl/train/config.py).
toolrl:
  num_tasks: 2048        # rollouts / training tasks to generate for data prep
  seed: 42               # shared seed (must match eval harness split seed)
  max_turns: 10          # TaskEnv turn limit (passed to the tool)

algorithm:
  adv_estimator: grpo     # group-relative advantage (veRL's implementation)
  gamma: 1.0
  lam: 1.0
  use_kl_in_reward: False  # KL is applied in the actor loss, not the reward

data:
  train_files: data/grpo/train.parquet
  val_files: data/grpo/test.parquet
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 4096
  train_batch_size: 256    # prompts per iteration (x rollout.n = trajectories)
  return_raw_chat: True    # required for the tool agent loop
  shuffle: True
  seed: 42

actor_rollout_ref:
  model:
    path: checkpoints/dpo/final   # resume from the post-DPO checkpoint
    trust_remote_code: False
    use_remove_padding: False
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 4
    use_kl_loss: True       # GRPO: KL divergence added to the actor loss
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    grad_clip: 1.0
    clip_ratio: 0.2
    ppo_epochs: 1
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.0
    fsdp_config:
      param_offload: False
      optimizer_offload: False
  rollout:
    name: sglang
    mode: async             # required for the tool agent loop
    temperature: 1.0
    top_p: 1.0
    n: 8                    # group size for GRPO (> 1)
    multi_turn:
      enable: True          # multi-turn tool calling
      format: hermes
      tool_config_path: configs/tools.yaml
      max_assistant_turns: 12
      max_tool_response_length: 1024
    agent:
      default_agent_loop: tool_agent

reward_model:
  enable: False             # rule/verifiable reward only (no RM)
  reward_manager: naive

custom_reward_function:
  path: toolrl/train/reward.py   # task-success reward (binary; no partial credit)
  name: compute_score

trainer:
  project_name: toolrl
  experiment_name: grpo
  logger: ['console']
  nnodes: 1
  n_gpus_per_node: 8
  total_epochs: 10
  save_freq: 50
  test_freq: -1
  default_local_dir: checkpoints/grpo

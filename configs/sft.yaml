# ToolRL SFT stage config (TRL SFTTrainer).
#
# The SFT stage fine-tunes the base 3B model on successful (gold) tool-call
# trajectories to establish basic tool-call syntax competence before DPO/GRPO.
# TRL is used (not veRL): SFT is a plain supervised loss that TRL implements
# directly on HuggingFace checkpoints, and veRL's FSDP+Ray RL stack is
# disproportionate for it. See README.

model_path: base              # 3B base model (HF path/name)
output_dir: checkpoints/sft
train_data: data/sft/train.jsonl

learning_rate: 1e-5
num_train_epochs: 3.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
max_seq_length: 4096
num_tasks: 5120        # training tasks -> gold rollouts (SPEC ground truth: ~5,120)
seed: 42
save_steps: 500
logging_steps: 10
